[build-system]
requires = ["setuptools>=75.8.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "track_mj"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
# Simulation, environments and Brax PPO training on MuJoCo/MJX 4.0 and JAX 0.12. The JAX CUDA
# plugin, the Torch DAgger stack, the ONNX export and the interactive tools are optional sets below.
dependencies = [
    "absl-py>=2.2.2",
    "brax>=0.14",
    "colorlog",
    "flax>=0.12",
    "jax>=0.12.0.1,<0.13",
    "jaxlib>=0.12.0.1,<0.13",
    "jaxlie",
    "jaxopt>=0.8.5",
    "ml_collections>=1.1.0",
    "mujoco>=4.0.0,<4.1",
    "mujoco-mjx[warp]>=4.0.0,<4.1",
    "numpy>=2.1,<3",
    "osqp>=1.0.5",
    # Playground 1.0 requires torch<2.14; 0.2 accepts MuJoCo 4.0.
    "playground>=0.2.0,<1",
    "pytz>=2025.2",
    "rich",
    "scipy>=1.16",
    "tqdm>=4.67.1",
    "tyro",
    "wandb>=0.22.2",
]

[project.optional-dependencies]
# JAX on NVIDIA GPUs with CUDA 13.
cuda = [
    "jax[cuda13]>=0.12.0.1,<0.13",
]
# The Torch DAgger and adapter training (track_mj.learning.policy.dagger).
training = [
    "einops>=0.8.1",
    "onnx",
    "onnxruntime>=1.23",
    "torch>=2.14,<2.15",
]
# ONNX export of Brax and Torch policies (track_mj.eval.*.brax2onnx, export_onnx, torch2onnx).
# The trainers import it only when convert_onnx is set.
export = [
    "matplotlib",
    "onnx",
    "onnxruntime>=1.23",
    "onnxscript>=0.5.6",
    "tensorflow-cpu>=2.21",
    "tf2onnx>=1.17",
]
# Rendering, videos and interactive tools (play scripts, onnx videos, viewers).
display = [
    "gradio",
    "imageio>=2.37.0",
    "imageio-ffmpeg>=0.6.0",
    "loop-rate-limiters>=1.2.0",
    "mediapy",
    "opencv-python",
    "PyQt5",
]
# Declared by earlier releases; no module in track_mj imports them.
tools = [
    "accelerate",
    "evdev>=1.9.2",
    "huggingface-hub>=0.36.0",
    "hydra-core>=1.3.2",
    "scikit-learn>=1.8.0",
    "swanlab>=0.6.12",
    "toml",
    "trimesh>=4.9.0",
]
dev = [
    "black>=25.9.0",
    "debugpy>=1.8.17",
    "ipdb>=0.13.13",
]

[tool.setuptools]
packages = ["track_mj"]

[tool.ruff]
line-length = 120  # You can match black's default
target-version = "py312"  # Adjust to your Python version

[tool.ruff.lint]
select = ["F"]
ignore = ["F401"]
